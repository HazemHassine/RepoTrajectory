[project]
name = "repotrajectory-api"
version = "0.1.0"
description = "Collection, analytics, and API for GitHub OSS intelligence"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "orjson>=3.10,<4",
  "pydantic-settings>=2.5,<3",
  "python-dateutil>=2.9,<3",
  "pyyaml>=6,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.4,<26",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["aiosqlite>=0.20,<1", "mypy>=1.11,<2", "pytest>=8,<9", "pytest-asyncio>=0.24,<1", "respx>=0.21,<1", "ruff>=0.7,<1", "types-python-dateutil>=2.9", "types-PyYAML>=6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
