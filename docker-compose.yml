services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: github_analytics
      POSTGRES_PASSWORD: github_analytics
      POSTGRES_DB: github_analytics
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U github_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    image: repotrajectory-backend:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://github_analytics:github_analytics@postgres:5432/github_analytics
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  collector:
    image: repotrajectory-backend:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://github_analytics:github_analytics@postgres:5432/github_analytics
    command: ["python", "-m", "app.cli", "collector"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    image: repotrajectory-web:local
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-10100}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
